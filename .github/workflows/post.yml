name: Post reel

on:
  schedule:
    - cron: '47 23 * * *'   # backup only: GitHub often starts this hours late (23:47 UTC = 5:47pm Belize)
  push:
    branches: ['claude/post-trigger']   # the on-time start: a Claude routine pushes here each evening
  workflow_dispatch:
    inputs:
      count:
        description: How many reels to post now
        default: '1'

permissions:
  contents: write

concurrency: post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the trigger branch only starts the run; the queue always lives on main
      - name: Post to Instagram
        run: python post.py "$COUNT"
        env:
          COUNT: ${{ inputs.count || '1' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Record what was posted
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Mark posted reels' && git push || echo 'Nothing new to record'
